{% extends "base.html" %}

{% block content %}

<h1 class="page-title">Our Menu 🍽️</h1>

<div class="menu-grid">

    {% for item in items %}

    <div class="food-card">

        <div class="food-icon">
            🍴
        </div>

        <h2>{{ item.name }}</h2>

        <p>
            {{ item.description }}
        </p>

        <p class="category">
            Category: {{ item.category }}
        </p>

        <h3>
            ₹{{ item.price }}
        </h3>

        <a href="{{ url_for('add_to_cart', item_id=item.id) }}"
           class="btn">

            Add to Cart 🛒

        </a>

    </div>

    {% endfor %}

</div>

{% endblock %}
