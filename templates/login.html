{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Login to Food Express 🍔</h2>

    <form method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p class="form-text">
        Don't have an account?
        <a href="{{ url_for('register') }}">
            Register here
        </a>
    </p>

</div>

{% endblock %}
